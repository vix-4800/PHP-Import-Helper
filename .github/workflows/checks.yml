---
name: Checks

'on':
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint (Ubuntu, Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run check-types

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - '22'
          - '24'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: npm run package

      - run: npm run test:unit

      - name: Run integration tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Run integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.os }}-${{ matrix.node }}
          path: |-
            out/
            dist/
            .vscode-test/
